name = "forge-pi"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
version = "0.1.0"

[vars]
VERSION = "0.1.0"

# Workers AI for embedding
[ai]
binding = "AI"

# Vectorize for capability discovery
[[vectorize]]
binding = "VECTORIZE"
index_name = "fleet-crates"

# KV for I2I bottles, routing, state
[[kv_namespaces]]
binding = "FLEET_KV"
id = "3db4cb084224415cada2c97d84365491"

# Cron: every 30 min, check for stale bottles and clean up
[triggers]
crons = ["*/30 * * * *"]
